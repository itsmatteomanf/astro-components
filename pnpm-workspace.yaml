packages:
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - "@astrojs/markdown-satteri@0.4.9"
  - "@astrojs/runtime@0.1.1"
  - "@astrojs/vite-plugin-astro@0.1.2"
  - astro@7.4.11
  - prettier@3.10.0

# TypeScript 7 lacks the compiler API required by tsup and Prettier plugins.
overrides:
  typescript: 7.0.2
