name: Astro Compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Astro ${{ matrix.astro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astro: ["4.16.19", "5.18.2", "6.4.8", "7.4.11"]
    permissions:
      contents: read
    env:
      ASTRO_VERSION: ${{ matrix.astro }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package artifacts
        run: pnpm run build

      - name: Build and verify a consumer application
        run: pnpm run test:consumer
